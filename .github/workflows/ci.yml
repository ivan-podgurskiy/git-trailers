name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run Node 24 quality gates
        if: matrix.node == 24
        run: |
          npm run conformance:check
          npm run typecheck
          npm run format:check
          npm run pack:check

  differential:
    name: Git 2.54.0 differential
    runs-on: ubuntu-latest
    env:
      GIT_TAG: v2.54.0
      GIT_VERSION: 2.54.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set Git paths
        run: |
          printf 'GIT_SOURCE_DIR=%s\n' "$RUNNER_TEMP/git-trailers-git/source-v2.54.0" >> "$GITHUB_ENV"
          printf 'GIT_TRAILERS_GIT=%s\n' "$RUNNER_TEMP/git-trailers-git/v2.54.0/bin/git" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Restore Git 2.54.0 binary
        id: git-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/git-trailers-git/v2.54.0/bin/git
          key: git-trailers-git-${{ runner.os }}-${{ env.GIT_TAG }}
      - name: Build Git 2.54.0
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$GIT_SOURCE_DIR")" "$(dirname "$GIT_TRAILERS_GIT")"
          git clone --depth 1 --branch "$GIT_TAG" https://github.com/git/git.git "$GIT_SOURCE_DIR"
          test "$(git -C "$GIT_SOURCE_DIR" describe --tags --exact-match HEAD)" = "$GIT_TAG"
          (
            cd "$GIT_SOURCE_DIR"
            make -j2 git NO_CURL=YesPlease NO_TCLTK=YesPlease
          )
          cp "$GIT_SOURCE_DIR/git" "$GIT_TRAILERS_GIT"
          chmod +x "$GIT_TRAILERS_GIT"
      - name: Verify pinned Git binary
        run: |
          test -f "$GIT_TRAILERS_GIT"
          chmod +x "$GIT_TRAILERS_GIT"
          test -x "$GIT_TRAILERS_GIT"
          test "$("$GIT_TRAILERS_GIT" --version)" = "git version $GIT_VERSION"
      - run: npm run differential
